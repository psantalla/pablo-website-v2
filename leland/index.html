<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sale price model</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("/fonts/Inter-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/fonts/Inter-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --c-fg: #131117;

    --c-fg-muted: rgba(19, 17, 23, 0.702);
    --c-fg-off: rgba(19, 17, 23, 0.529);
    --c-bg: #f5f5f5;
    --c-accent: #F55D3E;
    --sp-2xs: 0.25rem;
    --sp-xs: 0.5rem;
    --sp-s: 0.75rem;
    --sp-m: 1rem;
    --sp-l: 1.5rem;
    --sp-xl: 2rem;
    --ff: "Inter", -apple-system, system-ui, sans-serif;
    --ff-mono: "Andale Mono", Consolas, Menlo, Monaco, "Courier New", monospace;
    --fs-s: clamp(0.888rem, -0.033vi + 0.898rem, 0.882rem);
    --fs-m: clamp(0.999rem, 0.003vi + 0.998rem, 1rem);
    --fs-l: clamp(1.124rem, 0.05vi + 1.109rem, 1.133rem);
    --fs-xl: clamp(1.265rem, 0.109vi + 1.232rem, 1.284rem);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --c-fg: #f5f5f5;

      --c-fg-muted: rgba(245, 245, 245, 0.851);
      --c-fg-off: rgba(245, 245, 245, 0.49);
      --c-bg: #0c0b0f;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--c-bg);
    color: var(--c-fg);
    font-family: var(--ff);
    font-size: var(--fs-m);
    font-weight: 400;
    line-height: 150%;
    max-width: 45em;
    margin: 0 auto;
    padding: var(--sp-xl) var(--sp-l);
  }

  .lang-switch {
    display: flex;
    gap: var(--sp-xs);
    margin-bottom: var(--sp-l);
    font-size: var(--fs-s);
  }

  .lang-switch button {
    background: none;
    border: none;
    font-family: var(--ff);
    font-size: var(--fs-s);
    color: var(--c-fg-off);
    cursor: pointer;
    padding: 0;
    border-bottom: 1px solid transparent;
  }

  .lang-switch button.active {
    color: var(--c-fg);
    border-bottom-color: var(--c-fg);
  }

  h1 {
    font-size: var(--fs-xl);
    font-weight: 500;
    letter-spacing: -.015em;
    line-height: 130%;
    margin-bottom: var(--sp-2xs);
  }

  .subtitle {
    color: var(--c-fg-muted);
    font-size: var(--fs-s);
    margin-bottom: var(--sp-xl);
  }

  .mono {
    font-family: var(--ff-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* result */
  .result {
    margin-bottom: var(--sp-xl);
  }

  .result-label {
    font-size: var(--fs-s);
    color: var(--c-fg-muted);
    margin-bottom: var(--sp-2xs);
  }

  .result-value {
    font-size: var(--fs-xl);
    font-weight: 500;
    line-height: 1.2;
  }

  .result-sub {
    font-size: var(--fs-s);
    color: var(--c-fg-muted);
    margin-top: var(--sp-2xs);
  }

  /* chart */
  svg.chart {
    display: block;
    width: 100%;
    height: auto;
    font-family: var(--ff-mono);
    font-variant-numeric: tabular-nums;
    margin-bottom: var(--sp-xl);
  }

  .chart-axis { stroke: var(--c-fg); stroke-width: 1; }
  .chart-grid { stroke: var(--c-fg-off); stroke-width: 0.5; stroke-dasharray: 2 2; opacity: 0.4; }
  .chart-curve { fill: none; stroke: var(--c-fg); stroke-width: 1.25; }
  .chart-target { stroke: var(--c-fg); stroke-width: 1; stroke-dasharray: 3 2; opacity: 0.7; }
  .chart-lbl { font-size: 10px; fill: var(--c-fg-muted); }
  .chart-dot { fill: var(--c-accent); }

  /* controls */
  .controls {
    display: flex;
    flex-direction: column;
    gap: var(--sp-m);
    margin-bottom: var(--sp-xl);
  }

  .control-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: var(--fs-s);
    color: var(--c-fg-muted);
  }

  .control-val { color: var(--c-fg); font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--c-fg-off);
    outline: none;
    margin: var(--sp-xs) 0;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--c-fg);
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: var(--c-fg);
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }

  /* notes */
  .notes {
    font-size: var(--fs-s);
    color: var(--c-fg-off);
    line-height: 150%;
  }

  .notes div + div { margin-top: var(--sp-2xs); }
  .notes strong { color: var(--c-fg-muted); font-weight: 500; }
</style>
</head>
<body>

<div class="lang-switch">
  <button id="lang-en" class="active">EN</button>
  <button id="lang-es">ES</button>
</div>

<h1 id="t-title">Listing price model</h1>
<p class="subtitle">San Pedro 90731 — 1,098 sqft, 2bd/1.5ba, HOA $225/mo</p>

<div class="result">
  <div class="result-label" id="t-price-label">List at</div>
  <div class="result-value mono" id="price-out">—</div>
  <div class="result-sub" id="price-sub"></div>
</div>

<svg class="chart" viewBox="0 0 600 280" preserveAspectRatio="xMidYMid meet" id="chart"></svg>

<div class="controls">
  <div>
    <div class="control-head">
      <span id="t-days-label">Sell within</span>
      <span class="control-val"><span id="days-val">45</span><span id="t-days-unit">d</span></span>
    </div>
    <input type="range" id="days" min="7" max="120" value="45" step="1">
  </div>
  <div>
    <div class="control-head">
      <span id="t-conf-label">Confidence</span>
      <span class="control-val"><span id="conf-val">80</span>%</span>
    </div>
    <input type="range" id="conf" min="50" max="95" value="80" step="1">
  </div>
</div>

<div class="notes" id="notes"></div>

<script>
(function(){
  var T = {
    en: {
      title: 'Sale price model',
      priceLabel: 'Expected sale price',
      daysLabel: 'Sell within',
      daysUnit: 'd',
      confLabel: 'Confidence',
      belowFMV: '% below FMV',
      aboveFMV: '% above FMV',
      atFMV: 'at FMV',
      notes:
        '<div><strong>FMV</strong> $600k based on comps, recent sales, and automated valuations for the area.</div>' +
        '<div><strong>Market</strong> 90731, Apr 2026. Median DOM 28d, sale-to-list 100%, $/sqft +4.9% YoY. Source: Orchard.</div>' +
        '<div><strong>Model</strong> Weibull survival (k=0.85, \u03b70\u224843.1, g\u224811.0). At FMV the median DOM is 28d; a 7% cut halves it. DOM = days to contract, not closing (add 30\u201345d escrow).</div>' +
        '<div>P(contract in N days) = 1 \u2212 exp(\u2212(N/\u03b7(p))^k), where \u03b7(p) = \u03b70 \u00b7 exp(g \u00b7 (p/FMV \u2212 1)).</div>' +
        '<div><strong>Caveats</strong> Above ~90% is tail-sensitive. Excludes financing failure, inspection, macro shocks. Assumes MLS + open house week 1. FSBO adds 3\u20135% discount.</div>'
    },
    es: {
      title: 'Modelo de precio de venta',
      priceLabel: 'Precio de venta esperado',
      daysLabel: 'Vender en',
      daysUnit: 'd',
      confLabel: 'Confianza',
      belowFMV: '% por debajo del FMV',
      aboveFMV: '% por encima del FMV',
      atFMV: 'en FMV',
      notes:
        '<div><strong>FMV</strong> $600k basado en comps, ventas recientes y valoraciones automatizadas de la zona.</div>' +
        '<div><strong>Mercado</strong> 90731, abr 2026. Mediana DOM 28d, venta/listing 100%, $/sqft +4,9% interanual. Fuente: Orchard.</div>' +
        '<div><strong>Modelo</strong> Supervivencia Weibull (k=0,85, \u03b70\u224843,1, g\u224811,0). En FMV la mediana DOM es 28d; un 7% de rebaja la reduce a la mitad. DOM = d\u00edas hasta contrato, no cierre (sumar 30\u201345d escrow).</div>' +
        '<div>P(contrato en N d\u00edas) = 1 \u2212 exp(\u2212(N/\u03b7(p))^k), donde \u03b7(p) = \u03b70 \u00b7 exp(g \u00b7 (p/FMV \u2212 1)).</div>' +
        '<div><strong>Advertencias</strong> Por encima de ~90% es sensible a la cola. Excluye fallo financiaci\u00f3n, inspecci\u00f3n, shocks macro. Asume MLS + open house semana 1. FSBO a\u00f1ade 3\u20135% descuento.</div>'
    }
  };

  var lang = 'en';

  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.getElementById('lang-en').className = l === 'en' ? 'active' : '';
    document.getElementById('lang-es').className = l === 'es' ? 'active' : '';
    var t = T[l];
    document.getElementById('t-title').textContent = t.title;
    document.getElementById('t-price-label').textContent = t.priceLabel;
    document.getElementById('t-days-label').textContent = t.daysLabel;
    document.getElementById('t-days-unit').textContent = t.daysUnit;
    document.getElementById('t-conf-label').textContent = t.confLabel;
    document.getElementById('notes').innerHTML = t.notes;
    update();
  }

  document.getElementById('lang-en').addEventListener('click', function(){ setLang('en'); });
  document.getElementById('lang-es').addEventListener('click', function(){ setLang('es'); });

  /* ── model ── */
  var FMV = 600000, k = 0.85;
  var ETA0 = 28 / Math.pow(Math.log(2), 1/k);
  var G = Math.log(ETA0 / (13 / Math.pow(Math.log(2), 1/k))) / 0.07;
  var CEIL = FMV * 1.05, BAND = CEIL - FMV;

  function eta(p) { return ETA0 * Math.exp(G * (p/FMV - 1)); }
  function prob(N, p) { return 1 - Math.exp(-Math.pow(N/eta(p), k)); }
  function softCeil(raw) {
    if (raw <= FMV) return raw;
    return FMV + BAND * (1 - Math.exp(-(raw - FMV) / BAND));
  }
  function maxP(N, C) {
    C = Math.max(0.005, Math.min(0.995, C));
    var raw = FMV * (1 + Math.log(N / Math.pow(Math.log(1/(1-C)), 1/k) / ETA0) / G);
    return softCeil(raw);
  }
  function fmt(x) { return '$' + Math.round(x).toLocaleString('en-US'); }

  var el = document.getElementById.bind(document);
  var svg = el('chart');
  var W = 600, H = 280;
  var M = {t:12, r:16, b:32, l:52};
  var pW = W-M.l-M.r, pH = H-M.t-M.b;

  function draw(N, price) {
    var pMin = Math.min(maxP(N, 0.99), FMV*0.75);
    var pMax = CEIL;
    var xS = function(p){return M.l+(p-pMin)/(pMax-pMin)*pW;};
    var yS = function(v){return M.t+(1-v)*pH;};
    var s = '';

    [0,0.25,0.5,0.75,1].forEach(function(t){
      var y=yS(t);
      s+='<line class="chart-grid" x1="'+M.l+'" y1="'+y+'" x2="'+(W-M.r)+'" y2="'+y+'"/>';
      s+='<text class="chart-lbl" x="'+(M.l-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(t*100)+'%</text>';
    });

    var range=pMax-pMin, step=range<120000?20000:40000;
    for(var p=Math.ceil(pMin/step)*step;p<=pMax;p+=step){
      var x=xS(p);
      s+='<line class="chart-grid" x1="'+x+'" y1="'+M.t+'" x2="'+x+'" y2="'+(H-M.b)+'"/>';
      s+='<text class="chart-lbl" x="'+x+'" y="'+(H-M.b+14)+'" text-anchor="middle">$'+Math.round(p/1000)+'k</text>';
    }

    s+='<line class="chart-axis" x1="'+M.l+'" y1="'+M.t+'" x2="'+M.l+'" y2="'+(H-M.b)+'"/>';
    s+='<line class="chart-axis" x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'"/>';

    var pts=[];
    for(var i=0;i<=140;i++){
      var pp=pMin+(pMax-pMin)*(i/140);
      pts.push(xS(pp).toFixed(1)+' '+yS(prob(N,pp)).toFixed(1));
    }
    s+='<path class="chart-curve" d="M'+pts.join('L')+'"/>';

    if(price>=pMin&&price<=pMax){
      var dotC=prob(N,price);
      var xT=xS(price),yT=yS(dotC);
      s+='<line class="chart-target" x1="'+M.l+'" y1="'+yT+'" x2="'+xT+'" y2="'+yT+'"/>';
      s+='<line class="chart-target" x1="'+xT+'" y1="'+yT+'" x2="'+xT+'" y2="'+(H-M.b)+'"/>';
      s+='<circle class="chart-dot" cx="'+xT+'" cy="'+yT+'" r="3"/>';
    }

    svg.innerHTML=s;
  }

  function update(){
    var N=+el('days').value, C=+el('conf').value/100;
    var t = T[lang];
    el('days-val').textContent=N;
    el('conf-val').textContent=Math.round(C*100);
    var price=maxP(N,C);
    var diff=Math.abs((1-price/FMV)*100);
    el('price-out').textContent=fmt(price);
    if (price < FMV * 0.999) {
      el('price-sub').textContent=diff.toFixed(1) + t.belowFMV;
    } else if (price > FMV * 1.001) {
      el('price-sub').textContent=diff.toFixed(1) + t.aboveFMV;
    } else {
      el('price-sub').textContent=t.atFMV;
    }
    draw(N,price);
  }

  el('days').addEventListener('input',update);
  el('conf').addEventListener('input',update);
  var initLang = (navigator.language || '').slice(0,2) === 'es' ? 'es' : 'en';
  setLang(initLang);
})();
</script>

</body>
</html>
